    <script>
      // Resolve the theme before first paint so there is no flash.
      // Dark is the default for everyone: it is the brand, not a preference
      // fallback. Light is a deliberate choice made with the header toggle, and
      // once chosen it is remembered.
      (function () {
        try {
          var stored = localStorage.getItem('yd-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.dataset.theme = theme;
        } catch (e) {
          /* storage blocked — the dark default on <html> already applies */
        }
      })();
    </script>
